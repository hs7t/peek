[project]
name = "peek"
version = "0.1.0"
description = "A CLI tool for previewing human-readable text files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "charset-normalizer==3.4.2",
    "click==8.2.1",
    "colorama==0.4.6",
    "markdown-it-py==3.0.0",
    "mdurl==0.1.2",
    "pip-autoremove==0.10.0",
    "pygments==2.19.1",
    "rapidfuzz==3.13.0",
    "rich==14.0.0",
    "setuptools==80.9.0",
    "shellingham==1.5.4",
    "thefuzz==0.22.1",
    "typer==0.16.0",
    "typing-extensions==4.14.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]
